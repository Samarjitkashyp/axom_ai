<!doctype html>
<html lang="en" class="h-full bg-slate-50 text-slate-800">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — Axom AI User Account</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
</style>
</head>
<body class="h-full bg-slate-50 flex items-center justify-center p-4 relative">

<div class="w-full max-w-md bg-white border border-slate-200/80 rounded-3xl p-8 shadow-xl relative z-10">
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 text-white text-2xl shadow-lg shadow-indigo-600/25 mb-4">
      <i class="fa-solid fa-brain"></i>
    </div>
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Sign in to Axom AI</h1>
    <p class="text-xs text-slate-500 mt-1.5">Manage your subscriptions, usage, and account settings</p>
  </div>

  {% if error %}
  <div class="mb-6 bg-rose-50 border border-rose-200 text-rose-600 text-xs px-4 py-3 rounded-xl flex items-center space-x-2">
    <i class="fa-solid fa-circle-exclamation shrink-0"></i>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <!-- Google One-Click Login -->
  <div class="mb-4">
    <div id="googleBtn" class="flex justify-center w-full"></div>
  </div>
  <div class="flex items-center my-4">
    <div class="flex-grow border-t border-slate-200"></div>
    <span class="flex-shrink mx-3 text-slate-400 text-xs font-semibold uppercase">Or with username</span>
    <div class="flex-grow border-t border-slate-200"></div>
  </div>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Username</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-user text-sm"></i>
        </div>
        <input type="text" name="username" required autofocus placeholder="Your username" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500 transition">
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-lock text-sm"></i>
        </div>
        <input type="password" name="password" required placeholder="••••••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:outline-none focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500 transition">
      </div>
    </div>

    <button type="submit" class="w-full mt-2 py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-sm rounded-xl shadow-md shadow-indigo-600/20 transition duration-200 flex items-center justify-center space-x-2">
      <span>Sign In to My Account</span>
      <i class="fa-solid fa-arrow-right text-xs"></i>
    </button>
  </form>

  <div class="mt-8 pt-6 border-t border-slate-100 text-center text-xs text-slate-500 space-y-2">
    <div>
      Don't have an account?
      <a href="/axomai-user/signup/" class="text-indigo-600 hover:text-indigo-700 font-semibold ml-1">
        Create Account (1 per device)
      </a>
    </div>
    <div>
      <a href="/" class="text-slate-500 hover:text-slate-700">
        ← Back to Axom AI Assistant
      </a>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  const GOOGLE_CLIENT_ID = "514662966676-fo4atqrjblkn8sadd2t0enhqi5mch5aq.apps.googleusercontent.com";
  function getOrCreateDeviceId() {
    try {
      let devId = localStorage.getItem('axom_device_uid');
      if (!devId) {
        devId = 'axom_dev_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
        localStorage.setItem('axom_device_uid', devId);
      }
      return devId;
    } catch(e) { return ''; }
  }

  function handleCredentialResponse(response) {
    if (!response || !response.credential) return;
    const deviceId = getOrCreateDeviceId();
    fetch('/api/auth/google/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Device-Id': deviceId
      },
      body: JSON.stringify({ credential: response.credential, device_id: deviceId })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        window.location.href = '/axomai-user/';
      } else {
        alert(data.error || 'Google sign-in failed.');
      }
    })
    .catch(err => {
      alert('Error during Google sign-in. Please try again.');
    });
  }

  function initGoogle() {
    if (window.google && window.google.accounts && window.google.accounts.id) {
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });
      const btn = document.getElementById('googleBtn');
      if (btn) {
        window.google.accounts.id.renderButton(btn, {
          theme: 'outline',
          size: 'large',
          width: Math.min(window.innerWidth - 64, 380),
          text: 'signin_with',
          shape: 'rectangular'
        });
      }
    } else {
      setTimeout(initGoogle, 100);
    }
  }
  window.addEventListener('DOMContentLoaded', initGoogle);
</script>
</body>
</html>
