{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        window.username = "{{ request.user.username|escapejs }}";
        window.isStaff = {{ request.user.is_staff|yesno:"true,false" }};

    <script type="module" src="{% static 'dist/assets/index.js' %}?v={% now 'U' %}"></script>
