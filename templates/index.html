{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axom AI - Modern AI Assistant</title>
    <meta name="description" content="Axom AI - Next Generation AI Workspace with multi-model support, intelligent assistance, and seamless productivity.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Vite React App Bundle Styles -->
    <link rel="stylesheet" href="{% static 'dist/assets/index.css' %}">
</head>
<body class="dark-theme">
    <div id="root"></div>

    <!-- Inject Django variables onto window object for React -->
    <script>
        window.isAuthenticated = {{ request.user.is_authenticated|yesno:"true,false" }};
        window.username = "{{ request.user.username|escapejs }}";
        window.isStaff = {{ request.user.is_staff|yesno:"true,false" }};
    </script>
    <!-- Vite React App Bundle Script -->
    <script type="module" src="{% static 'dist/assets/index.js' %}"></script>
</body>
</html>
