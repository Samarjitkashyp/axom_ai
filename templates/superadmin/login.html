<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axom AI — Super Admin Authentication</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
</style>
</head>
<body class="h-full bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">

<!-- Background Glow Elements -->
<div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

<div class="w-full max-w-md bg-slate-900/80 border border-slate-800 rounded-3xl p-8 backdrop-blur-xl shadow-2xl relative z-10">
  <!-- Logo & Title -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 text-white text-2xl shadow-lg shadow-indigo-600/40 mb-4">
      <i class="fa-solid fa-brain"></i>
    </div>
    <h1 class="text-2xl font-bold text-white">Axom AI Control Center</h1>
    <p class="text-xs text-slate-400 mt-1.5 uppercase tracking-widest font-semibold text-indigo-400">Super Admin Access Only</p>
  </div>

  {% if error %}
  <div class="mb-6 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm px-4 py-3 rounded-xl flex items-center space-x-2">
    <i class="fa-solid fa-circle-exclamation shrink-0"></i>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Admin Username</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
          <i class="fa-solid fa-user text-sm"></i>
        </div>
        <input type="text" name="username" required autofocus placeholder="admin" class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
          <i class="fa-solid fa-lock text-sm"></i>
        </div>
        <input type="password" name="password" required placeholder="••••••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
      </div>
    </div>

    <button type="submit" class="w-full mt-2 py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 flex items-center justify-center space-x-2">
      <i class="fa-solid fa-shield-halved"></i>
      <span>Authenticate Super Admin</span>
    </button>
  </form>

  <div class="mt-8 pt-6 border-t border-slate-800 text-center">
    <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition">
      ← Return to Main Application
    </a>
  </div>
</div>

</body>
</html>
