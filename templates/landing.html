<script>

    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Inter"', 'system-ui', '-apple-system', 'sans-serif'],

          assamese: ['"Noto Serif Bengali"', 'system-ui', 'sans-serif'],

        colors: {
          axom: {
            bg: '#0a0a0f',
            surface: '#111118',
            border: '#1e1e2a',

            accent2: '#e879f9',
          }
        },
        animation: {
          'gradient': 'gradient 8s ease infinite',
          'float': 'float 6s ease-in-out infinite',
          'glow': 'glow 4s ease-in-out infinite',

        keyframes: {
          gradient: {
            '0%, 100%': { backgroundPosition: '0% 50%' },

          float: {
            '0%, 100%': { transform: 'translateY(0px)' },
            '50%': { transform: 'translateY(-10px)' },

          glow: {
            '0%, 100%': { opacity: 0.5 },
            '50%': { opacity: 1 },

<style>
  html { scroll-behavior: smooth; }
  body { background: #0a0a0f; color: #e5e7eb; -webkit-font-smoothing: antialiased; }

  .grid-bg {
    background-image:
      linear-gradient(rgba(192,132,252,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(192,132,252,0.05) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .radial-fade {
    mask-image: radial-gradient(circle at 50% 40%, #000 0%, #000 40%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, #000 40%, transparent 75%);
  }
  .gradient-text {
    background: linear-gradient(120deg, #ffffff 0%, #c084fc 40%, #f472b6 60%, #ffffff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradient 8s ease infinite;
  }
  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    pointer-events: none;
  }
  .card-glow {
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.005));
    border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.3s;
  }
  .card-glow:hover {
    border-color: rgba(192,132,252,0.3);
    background: linear-gradient(135deg, rgba(192,132,252,0.05), rgba(255,255,255,0.01));
    transform: translateY(-2px);
  }
  .card-glow::before {
    content: '';
    position: absolute;
    inset: -1px;
    background: linear-gradient(120deg, transparent, rgba(192,132,252,0.15), transparent);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    border-radius: inherit;
  }
  .card-glow:hover::before { opacity: 1; }

  .btn-primary {
    background: linear-gradient(120deg, #c084fc 0%, #e879f9 50%, #c084fc 100%);
    background-size: 200% 200%;
    animation: gradient 6s ease infinite;
    color: #0a0a0f;
    font-weight: 600;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 10px 40px -10px rgba(192,132,252,0.5);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 50px -10px rgba(192,132,252,0.7);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.15s;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }

  /* Marquee logo strip */
  .marquee {
    display: flex;
    overflow: hidden;
    mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
  }
  .marquee-inner {
    display: flex;
    gap: 3rem;
    animation: scroll 30s linear infinite;
    flex-shrink: 0;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }

  /* code blocks in demo */
  .demo-window {
    background: #0e0e15;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    box-shadow: 0 30px 80px -20px rgba(192,132,252,0.15), 0 0 100px -30px rgba(232,121,249,0.1);
  }
</style>
</head>

<script type="text/babel" data-presets="react">

const CHAT_URL = "https://chat.aiaxom.co.in/";

const IconMenu     = (p) => <Icon {...p} path={<><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></>} />;
const IconClose    = (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />;

// ─────────────────────────── NAV ──────────────────────────────

    const onScroll = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', onScroll);

  }, []);

  const links = [
    { href: "#features",   label: "Features" },
    { href: "#pricing",    label: "Pricing" },
    { href: "#about",      label: "About" },
    { href: "#faq",        label: "FAQ" },

    <nav className={`fixed top-0 inset-x-0 z-50 transition-all duration-300 ${scrolled ? 'bg-axom-bg/80 backdrop-blur-lg border-b border-white/5' : ''}`}>

          {links.map(l => <a key={l.href} href={l.href} className="text-sm text-gray-400 hover:text-white transition">{l.label}</a>)}
        </div>

        <div className="hidden md:flex items-center gap-3">
          <a href={CHAT_URL} className="text-sm text-gray-300 hover:text-white transition">Sign in</a>
          <a href={CHAT_URL} className="btn-primary text-sm px-4 py-2 rounded-full inline-flex items-center gap-1.5">
            Open Chat <IconArrow className="w-4 h-4" />
          </a>
        </div>

        <button onClick={() => setOpen(!open)} className="md:hidden p-2 -mr-2 text-gray-300">
          {open ? <IconClose className="w-5 h-5" /> : <IconMenu className="w-5 h-5" />}

            <a href={CHAT_URL} className="btn-primary text-sm px-4 py-2.5 rounded-full text-center mt-2">Open Chat</a>
          </div>
        </div>
      )}
    </nav>
  );
}
