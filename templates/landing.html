<style>
  html { scroll-behavior: smooth; overflow-x: hidden; }
  body {
    background: #06060b;
    color: #e5e7eb;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    max-width: 100vw;
  }
  /* Custom scrollbar matching primary button colors */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0a0a10; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #c084fc, #e879f9);
    border-radius: 6px;
    border: 2px solid #0a0a10;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #a855f7, #d946ef);
  }
  * { scrollbar-width: thin; scrollbar-color: #c084fc #0a0a10; }
  section, header, footer, nav { max-width: 100vw; }

  /* Slide-in mobile drawer */
  .drawer-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 101;
    width: min(85vw, 340px);
    background: linear-gradient(180deg, #0e0d1a 0%, #06060b 100%);
    border-left: 1px solid rgba(192,132,252,0.2);
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: -30px 0 60px -20px rgba(192,132,252,0.15);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-item {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; color: #e5e7eb; font-size: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: all 0.15s;
  }
  .drawer-item:hover, .drawer-item:active {
    background: rgba(192,132,252,0.08);
    color: #f5d0fe;
    padding-left: 26px;
  }

  /* HERO with Assam image + dark overlay */
  .hero-bg {
    position: absolute; inset: 0;
    background-image: url("{% static 'dist/hero/assam.avif' %}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .hero-overlay {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(6,6,11,0.55) 0%, rgba(6,6,11,0.85) 55%, rgba(6,6,11,1) 100%),
      radial-gradient(ellipse at 30% 40%, rgba(168,85,247,0.25), transparent 60%),
      radial-gradient(ellipse at 80% 30%, rgba(236,72,153,0.15), transparent 55%);
  }

  /* Testimonial section with same Assam image */
  .assam-bg {
    background-image:
      linear-gradient(180deg, rgba(6,6,11,0.9) 0%, rgba(6,6,11,0.85) 100%),
      url("{% static 'dist/hero/assam.avif' %}");
    background-size: cover;
    background-position: center;
  }

  .grid-bg {
    background-image:
      linear-gradient(rgba(192,132,252,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(192,132,252,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .gradient-text {
    background: linear-gradient(120deg, #ffffff 0%, #c084fc 40%, #f472b6 60%, #ffffff 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradient 8s ease infinite;
  }
  @keyframes gradient { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

  .btn-primary {
    background: linear-gradient(120deg, #c084fc, #e879f9, #c084fc);
    background-size: 200% 200%;
    animation: gradient 6s ease infinite;
    color: #0a0a0f;
    font-weight: 600;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 10px 40px -10px rgba(192,132,252,0.5);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 50px -10px rgba(192,132,252,0.75); }

  .btn-ghost {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    transition: all 0.15s;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .card:hover {
    border-color: rgba(192,132,252,0.35);
    background: linear-gradient(180deg, rgba(192,132,252,0.06), rgba(255,255,255,0.02));
    transform: translateY(-3px);
    box-shadow: 0 25px 60px -25px rgba(192,132,252,0.35);
  }
  .card::after {
    content:''; position:absolute; inset:-1px; border-radius:inherit;
    background: linear-gradient(120deg, transparent, rgba(192,132,252,0.35), transparent);
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    mask: linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
    mask-composite: exclude; padding: 1px;
    -webkit-mask: linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
    -webkit-mask-composite: xor;
  }
  .card:hover::after { opacity: 1; }

  .mega-menu {
    position: absolute;
    top: 100%; left: 50%;
    transform: translateX(-50%) translateY(-8px);
    opacity: 0; visibility: hidden;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  .nav-item:hover .mega-menu, .mega-menu:hover {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .mega-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px; border-radius: 12px;
    transition: all 0.15s;
  }
  .mega-item:hover { background: rgba(192,132,252,0.08); }
  .mega-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(192,132,252,0.15), rgba(236,72,153,0.1));
    border: 1px solid rgba(192,132,252,0.2);
  }

  .glow-orb { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }

  .marquee { display: flex; overflow: hidden; mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent); }
  .marquee-inner { display: flex; gap: 3rem; animation: scroll 30s linear infinite; flex-shrink: 0; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
</style>
</head>
